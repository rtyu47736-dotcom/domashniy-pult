<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f5"><title>История — Домашний пульт</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#fff8f5;color:#493a40;font-family:Nunito,system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:30px 16px}.card{background:#fff;border:1px solid #f1e3e2;border-radius:24px;padding:22px;box-shadow:0 18px 50px #82525b12}h1{margin:0 0 8px;font-size:28px}.muted{color:#927e85}.field{width:100%;padding:13px;border:1px solid #f1e3e2;border-radius:12px;font:inherit;margin:10px 0}.btn{background:#df849d;color:white;border:0;border-radius:12px;padding:13px 18px;font:800 15px Nunito;cursor:pointer}.item{padding:15px 0;border-bottom:1px solid #f1e3e2}.item:last-child{border:0}.time{font-size:12px;color:#927e85}.comment{white-space:pre-wrap;margin-top:5px}.err{color:#a34b60;margin-top:10px}.back{color:#ad7b8a;text-decoration:none;display:inline-block;margin-bottom:16px}
</style></head><body><main class="wrap"><a class="back" href="/">← На главную</a><section class="card"><h1>История просьб 💌</h1><p class="muted">Этот раздел доступен только по паролю владельца.</p><form id="login"><input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Пароль администратора" required><button class="btn">Показать историю</button></form><div id="error" class="err"></div><div id="items"></div></section></main><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error'),items=document.getElementById('items');err.textContent='';items.textContent='Загружаю…';try{const r=await fetch('/api/admin',{headers:{'Authorization':'Bearer '+document.getElementById('pw').value}});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');items.replaceChildren();if(!d.requests.length){items.textContent='Пока заявок нет.';return}d.requests.forEach(x=>{const box=document.createElement('article');box.className='item';const title=document.createElement('strong');title.textContent=x.action;const time=document.createElement('div');time.className='time';time.textContent=new Date(x.created_at).toLocaleString('ru-RU');const comment=document.createElement('div');comment.className='comment';comment.textContent=x.comment||'Без комментария';box.append(title,time,comment);items.append(box)})}catch(e){items.textContent='';err.textContent=e.message==='Failed to fetch'?'Сервис истории ещё не настроен.':e.message||'Не удалось загрузить историю.'}});
</script></body></html>
