<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffeef1"><title>Домашний пульт ♡</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/heart.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#56343a;--muted:#a17e83;--pink:#e77991;--line:#f0d6d4}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,sans-serif;background:radial-gradient(circle at 10% 12%,#ffd9df 0 3px,transparent 4px),radial-gradient(circle at 90% 20%,#f8c7d0 0 4px,transparent 5px),linear-gradient(135deg,#fff5f2,#ffe9ee 48%,#fff7f1);background-size:46px 46px,64px 64px,auto}.wrap{width:min(100% - 24px,760px);margin:auto;padding:28px 0 42px}.top{text-align:center;margin-bottom:18px}.mascot{font-size:65px;line-height:1;filter:drop-shadow(0 8px 8px #e9a9b7);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}h1{font-size:clamp(32px,7vw,48px);line-height:1;margin:12px 0 8px;font-weight:900;color:#60383d;text-shadow:0 2px #fff}.sub{margin:0;color:#9d747d;font-weight:700}.panel{background:rgba(255,252,250,.95);border:3px solid white;border-radius:32px;padding:clamp(16px,4vw,28px);box-shadow:0 18px 55px #84485429,inset 0 0 0 1px #f8dfe1}.section-title{text-align:center;font-size:24px;font-weight:900;margin:2px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.choice{border:2px solid white;background:linear-gradient(145deg,#fff7f4,#ffe8e9);border-radius:23px;padding:12px 8px;min-height:145px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:0 5px 0 #e9c6c5,0 9px 18px #995d6617;transition:transform .2s,box-shadow .2s,border-color .2s}.choice:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 8px 0 #e9c6c5,0 15px 24px #995d6626;border-color:#f6c4cf}.choice:active{transform:translateY(2px) scale(.97);box-shadow:0 2px 0 #e9c6c5}.choice.selected{background:linear-gradient(145deg,#ffe2e9,#ffd2dc);border-color:#e98da1;box-shadow:0 5px 0 #d99aa7,0 0 0 3px #f9d9e0}.art{height:76px;display:flex;align-items:center;font-size:49px;filter:drop-shadow(0 4px 2px #7e4c4c1f)}.choice-label{font-weight:900;font-size:15px;line-height:1.15;text-align:center}.form{margin-top:22px;display:none;animation:rise .25s ease}.form.show{display:block}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.selected-line{text-align:center;font-weight:900;font-size:18px;margin-bottom:13px}.field-label{display:block;font-size:14px;font-weight:900;margin:12px 0 8px}.comment{width:100%;min-height:94px;resize:vertical;border:2px solid var(--line);border-radius:19px;padding:14px 16px;font:600 15px Nunito,sans-serif;color:var(--ink);background:#fffdfc;outline:none}.comment:focus{border-color:#e98da1;box-shadow:0 0 0 4px #f9dce3}.send{width:100%;margin-top:15px;border:0;border-radius:19px;padding:16px;background:linear-gradient(135deg,#ed8da3,#d85e7d);color:white;font:900 17px Nunito,sans-serif;cursor:pointer;box-shadow:0 6px 0 #b84e6a,0 12px 20px #d9869d44}.send:active{transform:translateY(3px)}.send:disabled{opacity:.6;cursor:wait}.hint{text-align:center;color:var(--muted);font-size:12px}.status{display:none;margin-top:17px;padding:17px 14px;border-radius:20px;background:#eff9ee;color:#456b4b;font-weight:900;text-align:center;border:2px solid #dcefd9}.status.show{display:block;animation:rise .25s ease}.status.warn{background:#fff4e8;color:#8a6135;border-color:#f7dfbf}.status-cat{font-size:34px;display:block}.foot{text-align:center;color:#a77f86;font-size:13px;font-weight:800;margin:21px 0 0}@media(max-width:560px){.wrap{width:calc(100% - 18px);padding-top:19px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.choice{min-height:132px}.art{height:69px;font-size:45px}.choice-label{font-size:14px}.panel{border-radius:26px;padding:17px 13px}.mascot{font-size:57px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="wrap"><header class="top"><div class="mascot">🐱💕</div><h1>Домашний пульт</h1><p class="sub">Маленькие просьбы для большого счастья ♡</p></header><section class="panel"><h2 class="section-title">Чего тебе хочется? ✨</h2><div class="grid" id="choices">
<button class="choice" data-action="Хочу чай"><span class="art">🐱🍵</span><span class="choice-label">Хочу чай</span></button><button class="choice" data-action="Хочу кофе"><span class="art">😺☕</span><span class="choice-label">Хочу кофе</span></button><button class="choice" data-action="Хочу кушать"><span class="art">😸🍜</span><span class="choice-label">Хочу кушать</span></button><button class="choice" data-action="Хочу внимания"><span class="art">🐈💕</span><span class="choice-label">Хочу внимания</span></button><button class="choice" data-action="Открой окно"><span class="art">🐱🪟</span><span class="choice-label">Открой окно</span></button><button class="choice" data-action="Закрой окно"><span class="art">😽🌬️</span><span class="choice-label">Закрой окно</span></button><button class="choice" data-action="Хочу сладкого"><span class="art">🐈🍰</span><span class="choice-label">Хочу сладкого</span></button><button class="choice" data-action="18+"><span class="art">😼💗</span><span class="choice-label">18+</span></button><button class="choice" data-action="Гулять"><span class="art">🐈🍂</span><span class="choice-label">Гулять</span></button><button class="choice" data-action="Сходить в магазин"><span class="art">😺🛍️</span><span class="choice-label">Сходить в магазин</span></button><button class="choice" data-action="Отправить мужа в Ozon"><span class="art">🐱📦</span><span class="choice-label">Отправить мужа в…</span></button></div>
<div id="destination" style="display:none;margin-top:14px"><label class="field-label" for="where">Куда отправляем мужа? 😹</label><select id="where" class="comment" style="min-height:52px;resize:none"><option value="">Выбери пункт назначения…</option><option value="Ozon">Ozon</option><option value="Wildberries">Wildberries</option><option value="аптеку">В аптеку</option><option value="Пятёрочку">В «Пятёрочку»</option><option value="жопу">В жопу 😂</option></select></div>
<form class="form" id="requestForm"><div class="selected-line"><span id="selectedEmoji">💗</span> <span id="selectedText"></span></div><label class="field-label" for="comment">Комментарий <span style="font-weight:700;color:#ad989d">(по желанию)</span></label><textarea class="comment" id="comment" maxlength="500" placeholder="Например: возьми ещё что-нибудь вкусненькое…"></textarea><button class="send" id="sendBtn" type="submit">Отправить просьбу ♡</button><p class="hint">Твоя просьба уже почти летит адресату 🐾</p></form><div class="status" id="status" role="status" aria-live="polite"></div></section><p class="foot">Сделано с любовью и кошачьим контролем 🐾</p></main>
<script>
const API='/api/request',icons={'Хочу чай':'🐱🍵','Хочу кофе':'😺☕','Хочу кушать':'😸🍜','Хочу внимания':'🐈💕','Открой окно':'🐱🪟','Закрой окно':'😽🌬️','Хочу сладкого':'🐈🍰','18+':'😼💗','Гулять':'🐈🍂','Сходить в магазин':'😺🛍️','Отправить мужа в Ozon':'🐱📦'};let selected='';const form=document.getElementById('requestForm'),statusBox=document.getElementById('status'),sendBtn=document.getElementById('sendBtn'),destination=document.getElementById('destination'),where=document.getElementById('where');
function choose(action,button){selected=action;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b===button));document.getElementById('selectedEmoji').textContent=icons[action]||'🐾';document.getElementById('selectedText').textContent=action;form.classList.add('show');statusBox.className='status';statusBox.textContent='';form.scrollIntoView({behavior:'smooth',block:'nearest'})}
document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{statusBox.className='status';statusBox.textContent='';if(btn.dataset.action==='Отправить мужа в Ozon'){destination.style.display='block';where.value='';form.classList.remove('show');selected='';document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b===btn));destination.scrollIntoView({behavior:'smooth',block:'nearest'});return}destination.style.display='none';choose(btn.dataset.action,btn)}));
where.addEventListener('change',()=>{if(!where.value){form.classList.remove('show');selected='';return}selected='Отправить мужа в '+where.value;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.dataset.action==='Отправить мужа в Ozon'));document.getElementById('selectedEmoji').textContent='🐱📦';document.getElementById('selectedText').textContent=selected;form.classList.add('show');form.scrollIntoView({behavior:'smooth',block:'nearest'})});
form.addEventListener('submit',async e=>{e.preventDefault();if(!selected||sendBtn.disabled)return;sendBtn.disabled=true;sendBtn.textContent='Отправляю…';statusBox.className='status';statusBox.textContent='';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:selected,comment:document.getElementById('comment').value,website:''})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Не удалось отправить заявку');statusBox.className='status show';statusBox.innerHTML='<span class="status-cat">😻💌</span>Ура! Просьба отправлена. Любимый уже получил уведомление ❤️';document.getElementById('comment').value='';where.value='';destination.style.display='none';document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));form.classList.remove('show');selected=''}catch(err){statusBox.className='status show warn';statusBox.textContent=err.message||'Не получилось отправить. Проверь интернет и попробуй ещё раз.'}finally{sendBtn.disabled=false;sendBtn.textContent='Отправить просьбу ♡'}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
