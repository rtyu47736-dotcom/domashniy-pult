<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f0"><title>Домашний пульт — просьбы в лапках</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#4c2521;--rose:#d95c75;--rose2:#ef9baa;--cream:#fff8f4;--line:#e8c6bf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 14px 38px;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background-color:#fff0ed;background-image:linear-gradient(rgba(255,246,244,.12),rgba(255,246,244,.12)),url('/cats-bg.svg');background-position:center center;background-size:cover;background-attachment:fixed;background-repeat:repeat}
body:before{content:"";position:fixed;inset:-20px;z-index:-1;pointer-events:none;opacity:.22;font-size:clamp(24px,4vw,48px);line-height:1.8;letter-spacing:10px;word-break:break-all;overflow:hidden}
.wrap{width:min(100%,920px);margin:0 auto}
.panel{position:relative;overflow:hidden;padding:clamp(22px,4vw,42px);border:7px solid #fff;border-radius:54px;background:linear-gradient(180deg,rgba(255,249,246,.97),rgba(255,245,241,.97));box-shadow:0 18px 48px #9e5b5333,inset 0 0 0 2px #f2d5ce}
.panel:before{content:"";position:absolute;inset:10px;border:1px solid #f3dcd6;border-radius:40px;pointer-events:none}
.header{text-align:center;position:relative;z-index:1}
h1{font-size:clamp(35px,6.5vw,65px);line-height:1;margin:0;font-weight:1000;letter-spacing:-2px;color:#542a24;text-shadow:0 2px #fff}
.heart{color:#e96f83;font-size:1.05em}
.sub{margin:10px 0 0;font-size:clamp(15px,2.2vw,24px);font-weight:700;transform:rotate(-1deg)}
.hero{height:132px;display:flex;align-items:center;justify-content:center;position:relative;margin:4px auto 5px;max-width:430px}
.hero:before{content:"";position:absolute;bottom:8px;left:0;right:0;height:48px;border-bottom:3px solid #e8c9c2;border-radius:50%;background:radial-gradient(ellipse at 50% 100%,#f8e0dc 0 58%,transparent 59%)}
.hero-cat{font-size:100px;line-height:1;position:relative;filter:drop-shadow(0 5px 2px #9c6a5c33);animation:bob 3.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
.paw{position:absolute;font-size:34px;color:#d98b8e;opacity:.85}.paw.left{left:4%;top:16px}.paw.right{right:4%;top:22px}
h2{text-align:center;font-size:clamp(24px,4vw,39px);margin:8px 0 22px;font-weight:1000}
.spark{color:#dc8b48;margin:0 13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;position:relative;z-index:1}
.choice{min-width:0;min-height:174px;border:3px solid #fff;border-radius:32px;padding:8px 8px 12px;background:linear-gradient(145deg,#ffe8e2,#ffdcd7);box-shadow:0 5px 0 #e4c2b8,0 10px 20px #995a4c1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s,filter .22s}
.choice:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 8px 0 #e4c2b8,0 15px 24px #995a4c29;filter:saturate(1.06)}
.choice:active{transform:translateY(3px) scale(.975);box-shadow:0 2px 0 #e4c2b8}
.choice.selected{border-color:#e77f91;background:linear-gradient(145deg,#ffd7de,#ffcbd5);box-shadow:0 5px 0 #d69ba0,0 0 0 4px #f8d9dd}
.art{height:105px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;line-height:1;filter:drop-shadow(0 5px 2px #80514b25)}
.cat{font-size:clamp(58px,8vw,86px);transition:transform .22s}.prop{font-size:clamp(27px,4vw,39px);position:absolute;right:12%;bottom:10px;filter:drop-shadow(0 2px 1px #80514b30)}
.choice:hover .cat{transform:translateY(-4px) rotate(-5deg)}
.send-husband{cursor:default}.send-husband .destination{cursor:pointer}
.label{font-size:clamp(16px,2vw,22px);font-weight:1000;line-height:1.12;text-align:center}
.destination{display:none;width:100%;margin-top:6px;border:2px solid #efb9bc;border-radius:15px;padding:8px;background:#fff8f4;color:#6c3537;font:800 14px Nunito}
.destination.show{display:block}
.comment-wrap{position:relative;margin:28px 3px 0;z-index:1}
.comment{width:100%;min-height:82px;border:2px solid #e8c9c1;border-radius:26px;padding:20px 22px;background:#fffaf7;color:#542e2b;font:700 18px Nunito;resize:vertical;outline:none;transition:border-color .2s,box-shadow .2s}
.comment:focus{border-color:#e88c9d;box-shadow:0 0 0 4px #f7dce0}
.comment::placeholder{color:#a58c88}
.counter{text-align:right;color:#a88d87;font-size:13px;font-weight:800;margin:4px 16px 0}
.send-wrap{text-align:center;margin:20px 0 0;position:relative;z-index:1}
.send{border:3px solid #f7b6c0;border-radius:999px;padding:15px 42px;min-width:min(100%,420px);background:linear-gradient(180deg,#ec7188,#d64f6d);color:white;font:1000 clamp(18px,2.6vw,26px) Nunito;box-shadow:0 6px 0 #a83d56,0 12px 20px #bd566633;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .18s}
.send:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-2px)}
.send:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #a83d56}
.send:disabled{opacity:.52;cursor:not-allowed}
.status{display:none;margin:20px auto 0;max-width:560px;padding:17px;border:2px solid #cfe7cf;border-radius:22px;background:#f0faed;color:#426b47;text-align:center;font-weight:900;font-size:18px;animation:pop .25s ease}
.status.show{display:block}.status.error{display:block;border-color:#f0c7b7;background:#fff0e8;color:#8a4b37}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.foot{text-align:center;font-size:18px;font-weight:800;margin:24px 0 0;color:#603833}
@media(max-width:620px){body{padding:10px 7px 24px}.panel{padding:20px 12px 24px;border-width:4px;border-radius:32px}.panel:before{inset:6px;border-radius:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{min-height:148px;border-radius:23px}.art{height:85px}.cat{font-size:65px}.prop{font-size:29px}.label{font-size:16px}.hero{height:105px}.hero-cat{font-size:78px}h2{margin-bottom:16px}.comment-wrap{margin-top:20px}.comment{min-height:72px;padding:16px;font-size:15px}.send{min-width:90%;padding:14px 18px}.foot{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Illustrated kawaii cat stickers */
:root{--cat-sheet:none}
.art{height:118px;overflow:hidden}
.sprite{display:flex;width:100%;height:100%;align-items:center;justify-content:center;background-image:none;filter:drop-shadow(0 3px 2px #80514b20)}
.sprite:before{font-size:clamp(66px,9vw,94px);line-height:1}
.s0:before{content:"🐱🍵"}.s1:before{content:"🐈☕"}.s2:before{content:"😺🍜"}.s3:before{content:"😻🍰"}
.s4:before{content:"😽💗"}.s5:before{content:"😼💗"}.s6:before{content:"🐱🪟"}.s7:before{content:"🐈🪟"}
.s8:before{content:"🐱🍂"}.s9:before{content:"🐈🛍️"}.s10:before{content:"😺📦"}.s11:before{content:"😻"}
.s0{--x:0%;--y:0%}.s1{--x:33.333%;--y:0%}.s2{--x:66.666%;--y:0%}.s3{--x:100%;--y:0%}
.s4{--x:0%;--y:50%}.s5{--x:33.333%;--y:50%}.s6{--x:66.666%;--y:50%}.s7{--x:100%;--y:50%}
.s8{--x:0%;--y:100%}.s9{--x:33.333%;--y:100%}.s10{--x:66.666%;--y:100%}.s11{--x:100%;--y:100%}
.hero-cat{font-size:92px;width:190px;height:118px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 5px 2px #9c6a5c22)}.hero-cat:before{content:"🐱"}
.choice{background:linear-gradient(145deg,#ffe9e5,#ffdcd9);border-color:#fff;box-shadow:0 5px 0 #e4bdb8,0 10px 20px #995a4c1a}
.choice.selected{background:linear-gradient(145deg,#ffd8df,#ffcbd4);border-color:#ee8a9b}
.label{letter-spacing:-.3px}
@media(max-width:620px){.art{height:96px}.sprite:before{font-size:70px}.hero-cat{width:155px;height:98px;font-size:76px}}
</style></head>
<body><main class="wrap"><section class="panel">
<header class="header"><h1>Домашний пульт <span class="heart">♡</span></h1><p class="sub">Маленькие просьбы для большого счастья ♡</p><div class="hero"><span class="paw left">🐾</span><span class="hero-cat"></span><span class="paw right">🐾</span></div></header>
<h2><span class="spark">›</span> Чего тебе хочется? <span class="spark">‹</span></h2>
<div class="grid" id="choices">
<button class="choice" type="button" data-action="Хочу чай"><span class="art"><span class="sprite s0"></span></span><span class="label">Хочу чай</span></button>
<button class="choice" type="button" data-action="Хочу кофе"><span class="art"><span class="sprite s1"></span></span><span class="label">Хочу кофе</span></button>
<button class="choice" type="button" data-action="Хочу кушать"><span class="art"><span class="sprite s2"></span></span><span class="label">Хочу кушать</span></button>
<button class="choice" type="button" data-action="Хочу сладкого"><span class="art"><span class="sprite s3"></span></span><span class="label">Хочу сладкого</span></button>
<button class="choice" type="button" data-action="Хочу внимания"><span class="art"><span class="sprite s4"></span></span><span class="label">Хочу внимания</span></button>
<button class="choice" type="button" data-action="Открой окно"><span class="art"><span class="sprite s6"></span></span><span class="label">Открой окно</span></button>
<button class="choice" type="button" data-action="Закрой окно"><span class="art"><span class="sprite s7"></span></span><span class="label">Закрой окно</span></button>
<button class="choice" type="button" data-action="18+"><span class="art"><span class="sprite s5"></span></span><span class="label">18+</span></button>
<button class="choice" type="button" data-action="Гулять"><span class="art"><span class="sprite s8"></span></span><span class="label">Гулять</span></button>
<button class="choice" type="button" data-action="Сходить в магазин"><span class="art"><span class="sprite s9"></span></span><span class="label">Сходить в магазин</span></button>
<div class="choice send-husband" id="husbandCard"><span class="art"><span class="sprite s10"></span></span><span class="label">Отправить мужа в…</span><select class="destination" id="where" aria-label="Куда отправить мужа"><option value="">Выбрать место…</option><option value="Ozon">Ozon</option><option value="Wildberries">Wildberries</option><option value="аптеку">В аптеку</option><option value="Пятёрочку">В «Пятёрочку»</option><option value="жопу">В жопу 😂</option></select></div>
</div>
<div class="comment-wrap"><textarea class="comment" id="comment" maxlength="200" placeholder="Комментарий (по желанию)…"></textarea><div class="counter"><span id="count">0</span> / 200</div></div>
<div class="send-wrap"><button class="send" id="sendBtn" disabled>➤　Отправить просьбу ♡</button></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<p class="foot">🐾　Сделано с любовью ♡　🐾</p>
</section></main>
<script>
const API='/api/request';
let selected='';
const buttons=[...document.querySelectorAll('.choice[data-action]')];
const husband=document.getElementById('husbandCard');
const where=document.getElementById('where');
const send=document.getElementById('sendBtn');
const status=document.getElementById('status');
const comment=document.getElementById('comment');
function setAction(action,card){
  selected=action;
  document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b===card));
  send.disabled=!selected;
  status.className='status';status.textContent='';
}
buttons.forEach(btn=>btn.addEventListener('click',()=>setAction(btn.dataset.action,btn)));
where.addEventListener('change',()=>{
  if(!where.value){selected='';husband.classList.remove('selected');send.disabled=true;return;}
  setAction('Отправить мужа в '+where.value,husband);
});
comment.addEventListener('input',()=>document.getElementById('count').textContent=comment.value.length);
send.addEventListener('click',async()=>{
  if(!selected||send.disabled)return;
  send.disabled=true;send.textContent='Отправляю…';status.className='status';status.textContent='';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:selected,comment:comment.value,website:''})});
    const data=await r.json();if(!r.ok)throw new Error(data.error||'Не удалось отправить просьбу');
    status.className='status show';status.innerHTML='😻💌<br>Ура! Просьба отправлена. Любимый уже получил уведомление ❤️';
    comment.value='';document.getElementById('count').textContent='0';selected='';
    document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));where.value='';
  }catch(err){status.className='status error';status.textContent=err.message||'Не получилось отправить. Попробуй ещё раз.'}
  finally{send.textContent='➤　Отправить просьбу ♡';send.disabled=!selected;}
});
</script></body></html>
