<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0e9">
<title>Домашний пульт ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#512d29;--rose:#df7181;--cream:#fff8f2;--line:#efd4c9;--shadow:#a56b5a2b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 12px 38px;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#f6e6dc url('/cats-bg.svg') center/cover fixed}
.wrap{width:min(100%,960px);margin:auto}
.panel{position:relative;overflow:hidden;padding:clamp(18px,3.5vw,38px);border:6px solid #fff;border-radius:42px;background:linear-gradient(180deg,#fffaf5f5,#fff4edfa);box-shadow:0 18px 50px var(--shadow),inset 0 0 0 1px #f3d8ce}
.panel:before{content:"";position:absolute;inset:9px;border:1px solid #f0d8ce;border-radius:32px;pointer-events:none}
header{text-align:center;position:relative;z-index:1}
h1{font-size:clamp(34px,6vw,62px);line-height:1;margin:4px 0 0;font-weight:1000;letter-spacing:-2px;color:#542b25}
.heart{color:#e66d82}
.sub{margin:10px 0 0;font-size:clamp(15px,2.2vw,22px);font-weight:800}
.hero{position:relative;width:min(100%,570px);height:clamp(260px,39vw,360px);margin:4px auto 4px;display:grid;place-items:center;isolation:isolate;overflow:hidden}
.hero:before{content:"";position:absolute;left:7%;right:7%;bottom:12px;height:55px;border-radius:50%;background:radial-gradient(ellipse,#edcfc6 0 45%,transparent 72%);border-bottom:2px solid #e6c3ba;z-index:-1}
.hero>img:not(.wish-float){height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 8px 5px #81584a20);animation:heroFloat 4s ease-in-out infinite;position:relative;z-index:1}.hero>img.wish-float{position:absolute;z-index:2;display:block;width:clamp(56px,8vw,82px);height:clamp(56px,8vw,82px);object-fit:contain;border-radius:50%;background:transparent;mix-blend-mode:multiply;filter:drop-shadow(0 5px 7px #80504428);pointer-events:none;animation:wishDrift 5.5s ease-in-out infinite}
@keyframes heroFloat{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
.wish-float{position:absolute;z-index:2;display:block;width:clamp(56px,8vw,82px);height:clamp(56px,8vw,82px);object-fit:contain;border-radius:50%;background:transparent;mix-blend-mode:multiply;filter:drop-shadow(0 5px 7px #80504428);pointer-events:none;animation:wishDrift 5.5s ease-in-out infinite}
.wish-float.w1{left:9%;top:25%;margin:-35px 0 0 -35px;animation-delay:-1s}.wish-float.w2{left:9%;top:54%;margin:-35px 0 0 -35px;animation-delay:-3.2s}.wish-float.w3{left:69%;top:17%;margin:-35px 0 0 -35px;animation-delay:-2s}.wish-float.w4{right:10%;top:56%;margin:-35px -35px 0 0;animation-delay:-4.1s}.wish-float.w5{left:29%;top:43%;margin:-35px 0 0 -35px;animation-delay:-2.7s}
@keyframes wishDrift{0%,100%{transform:translate3d(0,0,0) rotate(-4deg)}25%{transform:translate3d(2px,-3px,0) rotate(2deg)}50%{transform:translate3d(-2px,-4px,0) rotate(4deg)}75%{transform:translate3d(-3px,-2px,0) rotate(-2deg)}}
h2{text-align:center;font-size:clamp(23px,3.8vw,36px);margin:5px 0 20px;font-weight:1000}
.spark{color:#d98c4f;margin:0 10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative;z-index:1}
.choice{min-width:0;min-height:174px;border:3px solid #fff;border-radius:27px;padding:9px 8px 12px;background:linear-gradient(145deg,#ffebe4,#fbd8d1);box-shadow:0 5px 0 #e4c4b9,0 10px 20px #995a4c18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s,filter .22s;position:relative}
.choice:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 8px 0 #e4c4b9,0 15px 24px #995a4c25;filter:saturate(1.07)}
.choice:active{transform:translateY(2px) scale(.975);box-shadow:0 2px 0 #e4c4b9}
.choice.selected{border-color:#e77f91;background:linear-gradient(145deg,#ffdae0,#ffd0d5);box-shadow:0 5px 0 #d69ba0,0 0 0 4px #f8d9dd}
.art{width:min(100%,148px);aspect-ratio:1/1;flex:0 0 auto;border-radius:18px;background-repeat:no-repeat;background-position:center;background-size:contain;filter:drop-shadow(0 4px 3px #80514b22);transition:transform .25s;animation:artBreath 4.5s ease-in-out infinite}

.art.a0{background-image:url('/assets/button-tea.webp')}
.art.a1{background-image:url('/assets/button-coffee.webp')}
.art.a2{background-image:url('/assets/button-food.webp')}
.art.a3{background-image:url('/assets/button-sweet.webp')}
.art.a4{background-image:url('/assets/button-attention.webp')}
.art.a5{background-image:url('/assets/button-open-window.webp')}
.art.a6{background-image:url('/assets/button-closed-window.webp')}
.art.a7{background-image:url('/assets/button-walk.webp')}
.art.a8{background-image:url('/assets/button-shopping.webp')}
.art.a9{background-image:url('/assets/button-18plus-kristina.png')}
.art.cats{background-image:url('/assets/%D0%9C%D0%B8%D0%BB%D1%8B%D0%B5%20%D0%BA%D0%BE%D1%82%D0%B8%D0%BA%D0%B8%20%D0%BD%D0%B0%20%D1%83%D1%8E%D1%82%D0%BD%D0%BE%D0%BC%20%D0%BF%D0%BB%D0%B5%D0%B4%D0%B5.png')}
.cat-options{grid-column:span 3;display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:-3px}
.cat-options.show{display:flex}
.cat-option{border:2px solid #fff;border-radius:16px;padding:10px 17px;background:#fff1eb;color:#603832;font:900 15px Nunito;box-shadow:0 3px 0 #e4c4b9;cursor:pointer;transition:transform .18s,background .18s}
.cat-option:hover{transform:translateY(-2px);background:#ffe1dc}
.cat-option:active{transform:translateY(1px)}
@media(max-width:650px){.cat-options{grid-column:span 2}.cat-option{flex:1 1 42%;padding:10px 8px}}
.husband-options{grid-column:span 3;display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:-3px}
.husband-options.show{display:flex}
.husband-option{border:2px solid #fff;border-radius:16px;padding:10px 17px;background:#fff1eb;color:#603832;font:900 15px Nunito;box-shadow:0 3px 0 #e4c4b9;cursor:pointer;transition:transform .18s,background .18s}
.husband-option:hover{transform:translateY(-2px);background:#ffe1dc}
.husband-option:active{transform:translateY(1px)}
.joke-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:22px;background:#3d2929a6;backdrop-filter:blur(4px)}
.joke-modal.show{display:flex}
.joke-card{width:min(100%,340px);padding:22px 20px 18px;border:3px solid #fff;border-radius:28px;background:linear-gradient(145deg,#fff5ef,#ffe2df);box-shadow:0 12px 40px #24141455;text-align:center;animation:jokePop .28s ease-out}
.joke-cat{display:block;width:min(100%,190px);height:170px;object-fit:contain;margin:0 auto 8px;filter:drop-shadow(0 5px 5px #76504a22)}
.joke-text{font:1000 25px Nunito;color:#603832;margin:4px 0 18px}
.joke-close{border:2px solid #fff;border-radius:999px;padding:10px 26px;background:#e77f91;color:#fff;font:900 16px Nunito;box-shadow:0 3px 0 #c35e70;cursor:pointer}
@keyframes jokePop{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.joke-card{animation:none}}
@media(max-width:650px){.husband-options{grid-column:span 2}.husband-option{flex:1 1 42%;padding:10px 8px}}
#husbandCard .art{background-image:url('/assets/button-husband.webp')}

.choice:hover .art{transform:translateY(-3px) scale(1.035);animation:artWiggle .55s ease-in-out}
.choice.selected .art{animation:selectedPop .65s ease-out}
@keyframes artBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes artWiggle{0%,100%{transform:rotate(0) scale(1.03)}25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}
@keyframes selectedPop{0%{transform:scale(.92)}55%{transform:scale(1.1) rotate(-2deg)}100%{transform:scale(1)}}
.a0{--x:0%;--y:0%}.a1{--x:50%;--y:0%}.a2{--x:100%;--y:0%}
.a3{--x:0%;--y:50%}.a4{--x:50%;--y:50%}.a5{--x:100%;--y:50%}
.a6{--x:0%;--y:100%}.a7{--x:50%;--y:100%}.a8{--x:100%;--y:100%}
.label{font-size:clamp(15px,1.9vw,21px);font-weight:1000;line-height:1.12;text-align:center}
.select-wrap{grid-column:span 3;text-align:center}
.destination{display:none;width:min(100%,360px);margin:0 auto;border:2px solid #edc2bc;border-radius:15px;padding:11px;background:#fffaf6;color:#603936;font:800 15px Nunito}
.destination.show{display:block}
.comment-wrap{position:relative;margin:25px 3px 0;z-index:1}
.comment{width:100%;min-height:78px;border:2px solid #ecd0c7;border-radius:22px;padding:17px 20px;background:#fffaf7;color:#542e2b;font:700 17px Nunito;resize:vertical;outline:none;transition:border-color .2s,box-shadow .2s}
.comment:focus{border-color:#e88c9d;box-shadow:0 0 0 4px #f7dce0}
.comment::placeholder{color:#aa918a}
.counter{text-align:right;color:#a88d87;font-size:13px;font-weight:800;margin:4px 14px 0}
.send-wrap{text-align:center;margin:18px 0 0;position:relative;z-index:1}
.send{border:3px solid #f7b6c0;border-radius:999px;padding:14px 38px;min-width:min(100%,420px);background:linear-gradient(180deg,#ec8192,#d85b76);color:white;font:1000 clamp(18px,2.5vw,24px) Nunito;box-shadow:0 6px 0 #a83d56,0 12px 20px #bd566633;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .18s}
.send:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-2px)}
.send:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #a83d56}
.send:disabled{opacity:.5;cursor:not-allowed}
.status{display:none;margin:18px auto 0;max-width:560px;padding:16px;border:2px solid #cfe7cf;border-radius:20px;background:#f0faed;color:#426b47;text-align:center;font-weight:900;font-size:17px;animation:pop .25s ease}
.status.show{display:block}.status.error{display:block;border-color:#f0c7b7;background:#fff0e8;color:#8a4b37}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.music-player{width:min(100%,460px);margin:18px auto 8px;padding:12px 16px;border:2px solid #fff;border-radius:22px;background:linear-gradient(145deg,#fff0eb,#ffe3df);box-shadow:0 4px 0 #e7c9bf,0 8px 18px #995a4c12;display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.music-player button{width:38px;height:38px;border:1px solid #f2c8c2;border-radius:50%;background:#fffaf7;color:#663b35;font:900 17px Nunito;cursor:pointer;flex:0 0 auto}
.music-player button.play{width:44px;height:44px;background:linear-gradient(180deg,#ec8192,#d85b76);border-color:#e77b8d;color:#fff;font-size:18px}
.music-player button:active{transform:scale(.94)}
.music-info{min-width:0;flex:1;text-align:left}
.music-title{font-size:15px;font-weight:1000;line-height:1.1}
.music-sub{font-size:11px;font-weight:800;color:#a17c74;margin-top:3px}
.music-select{width:72px;border:1px solid #efcfc7;border-radius:12px;background:#fffaf7;color:#663b35;padding:8px 5px;font:900 13px Nunito}
.music-volume{width:64px;accent-color:#df7181}
@media(max-width:420px){.music-player{gap:6px;padding:10px 8px}.music-player button{width:34px;height:34px}.music-player button.play{width:40px;height:40px}.music-volume{width:48px}.music-select{width:64px}}
.foot{text-align:center;font-size:17px;font-weight:800;margin:22px 0 0;color:#70443d}
@media(max-width:650px){body{padding:8px 6px 22px}.panel{padding:17px 10px 22px;border-width:4px;border-radius:29px}.panel:before{inset:6px;border-radius:22px}.hero{height:255px;width:100%}.hero>img.wish-float,.wish-float{width:50px;height:50px;margin:-25px 0 0 -25px}.wish-float.w1{left:9%;top:25%;margin:-25px 0 0 -25px}.wish-float.w2{left:9%;top:54%;margin:-25px 0 0 -25px}.wish-float.w3{left:69%;top:17%;margin:-25px 0 0 -25px}.wish-float.w4{right:10%;top:56%;margin:-25px -25px 0 0}.wish-float.w5{left:29%;top:43%;margin:-25px 0 0 -25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{min-height:145px;border-radius:21px}.art{width:min(100%,125px)}.label{font-size:16px}.select-wrap{grid-column:span 2}.comment-wrap{margin-top:18px}.comment{font-size:15px;min-height:70px}.send{min-width:92%;padding:13px 16px}.foot{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main class="wrap"><section class="panel">
<header>
<h1>Домашний пульт <span class="heart">♡</span></h1>
<p class="sub">Маленькие просьбы для большого счастья ♡</p>
<div class="hero" aria-label="Кристина и её летающие желания"><img src="/assets/hero-kristina-clean.webp" alt="Кристина в шляпе"><img class="wish-float w1" src="/assets/wish-coffee.png" alt="" aria-hidden="true"><img class="wish-float w2" src="/assets/wish-tea.png" alt="" aria-hidden="true"><img class="wish-float w3" src="/assets/wish-window.png" alt="" aria-hidden="true"><img class="wish-float w4" src="/assets/wish-food.png" alt="" aria-hidden="true"><img class="wish-float w5" src="/assets/wish-cake.png" alt="" aria-hidden="true"></div>
<div class="music-player" aria-label="Музыкальный плеер">
 <button type="button" id="musicPrev" aria-label="Предыдущий трек">‹</button>
 <button type="button" class="play" id="musicToggle" aria-label="Воспроизвести">▶</button>
 <button type="button" id="musicNext" aria-label="Следующий трек">›</button>
 <div class="music-info"><div class="music-title">I.B.</div><div class="music-sub" id="musicState">Музыка для нашего дома ♡</div></div>
 <select class="music-select" id="musicTrack" aria-label="Выбрать композицию">
  <option value="0">I.B.</option><option value="1">I.B.</option><option value="2">I.B.</option><option value="3">I.B.</option><option value="4">I.B.</option>
 </select>
 <input class="music-volume" id="musicVolume" type="range" min="0" max="1" step="0.05" value="0.65" aria-label="Громкость">
 <audio id="siteMusic" preload="auto" autoplay></audio>
</div>
</header>
<h2><span class="spark">›</span> Чего тебе хочется? <span class="spark">‹</span></h2>
<div class="grid" id="choices">
<button class="choice" type="button" data-action="Хочу чай"><span class="art a0"></span><span class="label">Хочу чай</span></button>
<button class="choice" type="button" data-action="Хочу кофе"><span class="art a1"></span><span class="label">Хочу кофе</span></button>
<button class="choice" type="button" data-action="Хочу кушать"><span class="art a2"></span><span class="label">Хочу кушать</span></button>
<button class="choice" type="button" data-action="Хочу сладкого"><span class="art a3"></span><span class="label">Хочу сладкого</span></button>
<button class="choice" type="button" data-action="Хочу внимания"><span class="art a4"></span><span class="label">Хочу внимания</span></button>
<button class="choice" type="button" data-action="Открой окно"><span class="art a5"></span><span class="label">Открой окно</span></button>
<button class="choice" type="button" data-action="Закрой окно"><span class="art a6"></span><span class="label">Закрой окно</span></button>
<button class="choice" type="button" data-action="Гулять"><span class="art a7"></span><span class="label">Хочу гулять</span></button>
<button class="choice" type="button" data-action="Сходить в магазин"><span class="art a8"></span><span class="label">Сходить в магазин</span></button>
<button class="choice" type="button" data-action="18+"><span class="art a9"></span><span class="label">18+ ♡</span></button>
<button class="choice" id="catsCard" type="button" aria-expanded="false"><span class="art cats"></span><span class="label">Котики</span></button>
<div class="cat-options" id="catOptions" aria-label="Что сделать для котиков"><button class="cat-option" type="button" data-cat-action="Напоить">💧 Напоить</button><button class="cat-option" type="button" data-cat-action="Покормить">🥣 Покормить</button><button class="cat-option" type="button" data-cat-action="Убрать какашки">🧹 Убрать какашки</button></div>
<div class="choice" id="husbandCard" role="button" tabindex="0" aria-expanded="false"><span class="art a8"></span><span class="label">Отправить мужа в…</span></div>
<div class="husband-options" id="husbandOptions" aria-label="Куда отправить мужа"><button class="husband-option" type="button" data-husband-destination="Ozon">📦 Ozon</button><button class="husband-option" type="button" data-husband-destination="Wildberries">🛍️ Wildberries</button><button class="husband-option" type="button" data-husband-destination="аптеку">💊 В аптеку</button><button class="husband-option" type="button" data-husband-destination="Пятёрочку">🛒 В «Пятёрочку»</button><button class="husband-option" type="button" data-husband-destination="жопу">😂 В жопу</button></div>
<div class="joke-modal" id="jokeModal" role="dialog" aria-modal="true" aria-labelledby="jokeText">
 <div class="joke-card">
  <img class="joke-cat" src="/assets/popup-pleading-cat.webp" alt="Удивлённые котики">
  <div class="joke-text" id="jokeText">За что?</div>
  <button class="joke-close" id="jokeClose" type="button">Ладно ❤️</button>
 </div>
</div>
</div>
<div class="comment-wrap"><textarea class="comment" id="comment" maxlength="200" placeholder="Комментарий (по желанию)…"></textarea><div class="counter"><span id="count">0</span> / 200</div></div>
<div class="send-wrap"><button class="send" id="sendBtn" disabled>➤　Отправить просьбу ♡</button></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<p class="foot">🐾　Сделано с любовью ♡　🐾</p>
</section></main>
<script>
const musicFiles=['/music/ib-01.mp3','/music/ib-02.mp3','/music/ib-03.mp3','/music/ib-04.mp3','/music/ib-05.mp3'];
const music=document.getElementById('siteMusic'),musicToggle=document.getElementById('musicToggle'),musicPrev=document.getElementById('musicPrev'),musicNext=document.getElementById('musicNext'),musicTrack=document.getElementById('musicTrack'),musicVolume=document.getElementById('musicVolume'),musicState=document.getElementById('musicState');
let currentTrack=0;
try{currentTrack=Math.max(0,Math.min(4,Number(localStorage.getItem('pultMusicTrack')||0)));musicVolume.value=localStorage.getItem('pultMusicVolume')||'0.65'}catch(_){}
music.volume=Number(musicVolume.value);musicTrack.value=String(currentTrack);
function loadMusicTrack(i){currentTrack=(i+musicFiles.length)%musicFiles.length;music.src=musicFiles[currentTrack];musicTrack.value=String(currentTrack);try{localStorage.setItem('pultMusicTrack',String(currentTrack))}catch(_){}}
loadMusicTrack(currentTrack);
musicToggle.addEventListener('click',async()=>{try{if(music.paused){await music.play();musicToggle.textContent='Ⅱ';musicToggle.setAttribute('aria-label','Пауза');musicState.textContent='Сейчас играет I.B.'}else{music.pause();musicToggle.textContent='▶';musicToggle.setAttribute('aria-label','Воспроизвести');musicState.textContent='Пауза'}}catch(_){musicState.textContent='Нажми ещё раз, чтобы включить музыку ♡'}});
function changeMusicTrack(step){const wasPlaying=!music.paused;loadMusicTrack(currentTrack+step);if(wasPlaying){music.play().catch(()=>{});musicToggle.textContent='Ⅱ';musicState.textContent='Сейчас играет I.B.'}else{musicToggle.textContent='▶';musicState.textContent='Музыка для нашего дома ♡'}}
musicPrev.addEventListener('click',()=>changeMusicTrack(-1));musicNext.addEventListener('click',()=>changeMusicTrack(1));
musicTrack.addEventListener('change',()=>{const wasPlaying=!music.paused;loadMusicTrack(Number(musicTrack.value));if(wasPlaying){music.play().catch(()=>{});musicToggle.textContent='Ⅱ';musicState.textContent='Сейчас играет I.B.'}});
musicVolume.addEventListener('input',()=>{music.volume=Number(musicVolume.value);try{localStorage.setItem('pultMusicVolume',musicVolume.value)}catch(_){}});
// После завершения композиции сразу загружаем и запускаем следующую.
async function playNextTrack(){
 loadMusicTrack(currentTrack+1);
 try{
  await music.play();
  musicToggle.textContent='Ⅱ';
  musicToggle.setAttribute('aria-label','Пауза');
  musicState.textContent='Сейчас играет I.B.';
 }catch(_){
  musicState.textContent='Нажми ▶, чтобы продолжить музыку ♡';
  musicToggle.textContent='▶';
 }
}
music.addEventListener('ended',playNextTrack);
music.addEventListener('pause',()=>{musicToggle.textContent='▶';musicToggle.setAttribute('aria-label','Воспроизвести')});
music.addEventListener('play',()=>{musicToggle.textContent='Ⅱ';musicToggle.setAttribute('aria-label','Пауза')});

// Пытаемся включить первую композицию сразу при открытии сайта.
// Если браузер запрещает autoplay со звуком, запускаем её при первом касании.
let autoplayStarted=false;
async function startMusicOnEntry(){
 if(autoplayStarted || !music.paused) return;
 autoplayStarted=true;
 try{
  await music.play();
  musicState.textContent='Сейчас играет I.B.';
 }catch(_){
  autoplayStarted=false;
  musicState.textContent='Коснись экрана, чтобы включить музыку ♡';
  const unlock=async()=>{
   if(autoplayStarted) return;
   autoplayStarted=true;
   try{await music.play();musicState.textContent='Сейчас играет I.B.'}
   catch(_){autoplayStarted=false}
  };
  document.addEventListener('pointerdown',unlock,{once:true});
  document.addEventListener('keydown',unlock,{once:true});
 }
}
if(document.readyState==='complete') startMusicOnEntry();
else window.addEventListener('load',startMusicOnEntry,{once:true});

const API='/api/request';
let selected='';
const buttons=[...document.querySelectorAll('.choice[data-action]')];
const husband=document.getElementById('husbandCard');
const husbandOptions=document.getElementById('husbandOptions');
const send=document.getElementById('sendBtn');
const status=document.getElementById('status');
const comment=document.getElementById('comment');
function setAction(action,card){
 selected=action;
 document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b===card));
 send.disabled=!selected;
 status.className='status';status.textContent='';
}
buttons.forEach(btn=>btn.addEventListener('click',()=>setAction(btn.dataset.action,btn)));
const catsCard=document.getElementById('catsCard');
const catOptions=document.getElementById('catOptions');
catsCard.addEventListener('click',()=>{
 const opened=catOptions.classList.toggle('show');
 catsCard.setAttribute('aria-expanded',String(opened));
 if(opened){catsCard.classList.add('selected');selected='';send.disabled=true;status.className='status';status.textContent='';}
 else{catsCard.classList.remove('selected');}
});
catOptions.querySelectorAll('[data-cat-action]').forEach(option=>option.addEventListener('click',()=>{
 setAction('Котики — '+option.dataset.catAction,catsCard);
 catOptions.classList.add('show');
 catsCard.setAttribute('aria-expanded','true');
}));
function toggleHusbandOptions(){
 const opened=husbandOptions.classList.toggle('show');
 husband.setAttribute('aria-expanded',String(opened));
 if(opened){husband.classList.add('selected');selected='';send.disabled=true;status.className='status';status.textContent='';}
 else{husband.classList.remove('selected');}
}
husband.addEventListener('click',toggleHusbandOptions);
husband.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleHusbandOptions()}});
const jokeModal=document.getElementById('jokeModal');
const jokeText=document.getElementById('jokeText');
const jokeClose=document.getElementById('jokeClose');
const husbandJokes=['За что?','Ты уверена?','Он же хороший'];
function showHusbandJoke(){
 jokeText.textContent=husbandJokes[Math.floor(Math.random()*husbandJokes.length)];
 jokeModal.classList.add('show');
 jokeClose.focus();
}
function closeHusbandJoke(){jokeModal.classList.remove('show')}
jokeClose.addEventListener('click',closeHusbandJoke);
jokeModal.addEventListener('click',e=>{if(e.target===jokeModal)closeHusbandJoke()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&jokeModal.classList.contains('show'))closeHusbandJoke()});
husbandOptions.querySelectorAll('[data-husband-destination]').forEach(option=>option.addEventListener('click',()=>{
 setAction('Отправить мужа в '+option.dataset.husbandDestination,husband);
 husbandOptions.classList.add('show');
 husband.setAttribute('aria-expanded','true');
 if(option.dataset.husbandDestination==='жопу') showHusbandJoke();
}));
comment.addEventListener('input',()=>document.getElementById('count').textContent=comment.value.length);
send.addEventListener('click',async()=>{
 if(!selected||send.disabled)return;
 send.disabled=true;send.textContent='Отправляю…';status.className='status';status.textContent='';
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:selected,comment:comment.value,website:''})});
  const raw=await r.text();let data={};
  if(raw.trim()){try{data=JSON.parse(raw)}catch{throw new Error('Сервер вернул не JSON (HTTP '+r.status+').')}}
  else throw new Error('Сервер вернул пустой ответ (HTTP '+r.status+'). Проверьте функцию /api/request.');
  if(!r.ok)throw new Error(data.error||('Ошибка сервера HTTP '+r.status));
  status.className='status show';status.innerHTML='💌<br>Ура! Просьба отправлена. Любимый уже получил уведомление ❤️';
  comment.value='';document.getElementById('count').textContent='0';selected='';
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
 }catch(err){status.className='status error';status.textContent=err.message||'Не получилось отправить. Попробуй ещё раз.'}
 finally{send.textContent='➤　Отправить просьбу ♡';send.disabled=!selected}
});
</script></body></html>
